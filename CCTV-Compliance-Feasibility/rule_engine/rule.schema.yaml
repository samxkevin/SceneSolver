# Illustrative schema contract. It is intentionally narrower than a full JSON Schema so
# that an implementation can validate and allow-list every operator.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: CCTV compliance rule
type: object
required: [id, version, when, then]
properties:
  id: {type: string, pattern: '^[a-z][a-z0-9_.-]+$'}
  version: {type: integer, minimum: 1}
  description: {type: string}
  scope:
    type: object
    properties:
      cameras: {type: array, items: {type: string}}
      zones: {type: array, items: {type: string}}
      schedules: {type: array, items: {type: string}}
    additionalProperties: false
  unknown_policy:
    enum: [suppress, delay, escalate_review, treat_as_false]
    description: treat_as_false is permitted only for low-impact policies and requires approval
  when:
    $ref: '#/$defs/expression'
  exceptions:
    type: array
    items: {$ref: '#/$defs/expression'}
  then:
    type: object
    required: [event_type, action]
    properties:
      event_type: {type: string}
      severity: {enum: [info, low, medium, high, critical]}
      action: {type: array, items: {type: string}}
      cooldown: {type: string, pattern: '^[0-9]+(ms|s|m|h|d)$'}
      require_human_review: {type: boolean}
    additionalProperties: false
additionalProperties: false
$defs:
  expression:
    oneOf:
      - {$ref: '#/$defs/all'}
      - {$ref: '#/$defs/any'}
      - {$ref: '#/$defs/not'}
      - {$ref: '#/$defs/event'}
      - {$ref: '#/$defs/predicate'}
      - {$ref: '#/$defs/temporal'}
      - {$ref: '#/$defs/sequence'}
      - {$ref: '#/$defs/absence'}
  all:
    type: object
    required: [all]
    properties: {all: {type: array, minItems: 1, items: {$ref: '#/$defs/expression'}}}
    additionalProperties: false
  any:
    type: object
    required: [any]
    properties: {any: {type: array, minItems: 1, items: {$ref: '#/$defs/expression'}}}
    additionalProperties: false
  not:
    type: object
    required: [not]
    properties: {not: {$ref: '#/$defs/expression'}}
    additionalProperties: false
  event:
    type: object
    required: [event]
    properties:
      event: {type: string}
      args: {type: object}
      bind: {type: object}
      min_confidence: {type: number, minimum: 0, maximum: 1}
      min_quality: {type: number, minimum: 0, maximum: 1}
    additionalProperties: false
  predicate:
    type: object
    required: [predicate]
    properties:
      predicate: {type: string}
      args: {type: object}
      negate: {type: boolean}
    additionalProperties: false
  temporal:
    type: object
    required: [temporal]
    properties:
      temporal:
        type: object
        required: [operator, subject]
        properties:
          operator: {enum: [for_at_least, within, before, after, until, count]}
          subject: {$ref: '#/$defs/expression'}
          duration: {type: string}
          max_gap: {type: string}
          count: {type: integer, minimum: 1}
        additionalProperties: false
    additionalProperties: false
  sequence:
    type: object
    required: [sequence]
    properties:
      sequence: {type: array, minItems: 2, items: {$ref: '#/$defs/expression'}}
      within: {type: string}
      reset_on: {$ref: '#/$defs/expression'}
    additionalProperties: false
  absence:
    type: object
    required: [absence]
    properties:
      absence:
        type: object
        required: [event, window]
        properties:
          event: {$ref: '#/$defs/expression'}
          window: {type: object}
          require_healthy_observation: {type: boolean}
        additionalProperties: false
    additionalProperties: false
